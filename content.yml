# -----------------------------------------------------------------------------
#  SUMMARY
#  Keep the two-space indentation. Separate paragraphs with an empty line;
#  single line breaks inside a paragraph are ignored.
# -----------------------------------------------------------------------------
summary: |
  I am currently a Principal Applied Scientist at Microsoft Corporation working on the
  Business and Industry Copilot org. Before that I spent 5 years as a Senior Staff
  Reinforcement Learning Researcher at the
  [Lawrence Livermore National Lab](https://st.llnl.gov/research), where I pushed forward
  the state-of-the-art in Reinforcement Learning in several projects related to national
  defense, including AI-powered Antibody Therapeutics and Vaccine development. I also acted
  as the Scientific Outreach Coordinator for the LLNL Data Science Institute, supporting the
  organization of events to help set priorities for AI developments at the Lab. My Ms.c. and
  Ph.D. degrees have been awarded by the University of São Paulo, Brazil, where I was advised
  by Professor Anna Reali Costa. I have held a Postdoc position at the Advanced Institute for
  AI during 2019-2021, where I helped to approximate the industry and academic sectors in
  Brazil. During 2018-2019, I was a Visiting Researcher at the University of Texas at Austin,
  where I worked with Professor [Peter Stone](https://www.cs.utexas.edu/~pstone/). I also
  interned at [Borealis AI](https://www.borealisai.com/en/), where I did research related to
  my thesis topic with [Matthew Taylor](https://www.borealisai.com/en/team/prof-matthew-e-taylor/).

  My works are concerned with several topics of Machine Learning, but I am better known for
  my research on *Transfer Learning for Multiagent Reinforcement Learning* (read more about it
  in my [book](https://doi.org/10.2200/S01091ED1V01Y202104AIM049) or
  [survey](https://doi.org/10.1613/jair.1.11396)). More recently, I have been dedicating most
  of my time working on Machine Learning techniques to support the development of Antibody
  Therapeutics and Vaccines.

  I was involved in the organization of several academic workshops, including the
  [Adaptive Learning Agents (ALA) Workshop at AAMAS](https://ala2020.vub.ac.be/), the
  [Scaling-Up Reinforcement Learning (SURL) Workshop series](http://www.surl.tirl.info), and
  [Latinx in IA at NeurIPS](https://www.latinxinai.org/neurips-2019).

  I welcome new collaboration opportunities, just e-mail me (however, I cannot do much to help
  you land a specific position at my current or previous companies, so unless I personally
  shared the position saying I am the PI, e-mailing me won't be productive).

